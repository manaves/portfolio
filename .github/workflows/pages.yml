name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the site is complete
        run: |
          set -eu
          for f in index.html 404.html \
                   assets/css/site.css assets/js/site.js \
                   assets/img/maria.jpg; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          grep -q "assets/css/site.css" index.html
          echo "site files present"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        run: |
          set -eu
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '.kilo' --exclude '_site' ./ _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
